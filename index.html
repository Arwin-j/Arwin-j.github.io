<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P-Access Terminal</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- TITLE SCREEN -->
  <section id="title-screen" class="view">
    <div class="mode-toggle" role="group" aria-label="Interface mode">
      <button type="button" id="mode-simple" class="mode-opt">Simple</button>
      <button type="button" id="mode-terminal" class="mode-opt">Terminal</button>
    </div>
    <h1 class="welcome">Welcome</h1>
    <p class="welcome-subtitle">to my portfolio</p>
   
    <div class="btn-row">
      <button id="guest-btn" class="menu-btn" type="button">Guest</button>
      <!-- <button id="admin-btn" class="menu-btn" type="button">Admin</button> -->
    </div>
    <p id="mode-hint" class="mode-hint" aria-live="polite"></p>
  </section>

  <!-- ADMIN LOGIN -->
  <section id="login-screen" class="view hidden">
    <form id="login-form" class="login-box" autocomplete="off">
      <div class="field">
        <label for="login-user">LOGIN:</label>
        <input id="login-user" type="text" spellcheck="false">
      </div>
      <div class="field">
        <label for="login-pass">PASSWORD:</label>
        <input id="login-pass" type="password">
      </div>
      <p id="login-msg" aria-live="polite"></p>
      <div class="btn-row">
        <button type="submit" class="menu-btn small">Enter</button>
        <button type="button" id="back-btn" class="menu-btn small">Back</button>
      </div>
    </form>
  </section>

  <!-- SIMPLE MODE MENU (buttons instead of typing) -->
  <section id="menu-screen" class="view hidden">
    <h2 class="menu-title">Menu</h2>
    <p id="menu-user" class="menu-user"></p>
    <div id="menu-buttons" class="btn-row menu-buttons"></div>
  </section>

  <!-- TERMINAL -->
  <div class="screen hidden">
    <div class="loading">
      <div class="progress-bar"><div class="progress"></div></div>
      <div class="percent"></div>
    </div>
    <div id="terminal"></div>
  </div>

  <!-- POP-UP WINDOW (CRT style, modal + draggable) -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="crt-window" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="win-bar" id="win-bar">
        <span id="win-title">Window</span>
        <button type="button" id="win-close" class="win-close" aria-label="Close window">&times;</button>
      </div>
      <div class="win-body" id="win-body"></div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
